<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stroomprijzen vandaag</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>Stroomprijzen</h1>
        <p class="subtitle">Dynamische uurprijzen via EnergyZero, all-in inclusief btw</p>
      </div>
      <button id="refresh" class="refresh" type="button">Vernieuwen</button>
    </header>

    <nav id="day-tabs" class="tabs" aria-label="Kies een dag"></nav>

    <p id="error" class="error" hidden></p>

    <section id="summary" class="summary"></section>

    <section id="chart" class="chart" role="img" aria-label="Uurprijzen van de geselecteerde dag"></section>

    <p id="empty" class="empty" hidden></p>

    <footer class="footer">
      <span>Bron: EnergyZero · €/kWh inclusief btw</span>
      <span id="updated"></span>
    </footer>
  </main>
  <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
