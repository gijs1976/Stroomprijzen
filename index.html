<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stroomprijzen vandaag</title>
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>Stroomprijzen</h1>
        <p class="subtitle">Dynamische uurprijzen via EnergyZero, all-in inclusief btw</p>
      </div>
      <button id="refresh" class="refresh" type="button">Vernieuwen</button>
    </header>

    <nav class="date-nav" aria-label="Kies een datum">
      <button id="prev-day" class="nav-arrow" type="button" aria-label="Een dag terug">◀</button>
      <div class="date-label">
        <span id="date-text"></span>
        <span id="date-chip" class="date-chip" hidden></span>
      </div>
      <button id="next-day" class="nav-arrow" type="button" aria-label="Een dag verder">▶</button>
    </nav>

    <div class="block-control">
      <label for="block-slider">Goedkoopste blok van</label>
      <input id="block-slider" type="range" min="2" max="8" step="1" value="4" aria-label="Duur van het goedkoopste blok in uren">
      <output id="block-value" for="block-slider">4 uur</output>
    </div>

    <div class="block-control surcharge-control">
      <div class="surcharge-field">
        <label for="energiebelasting">Energiebelasting (€/kWh incl. btw)</label>
        <input id="energiebelasting" type="number" step="0.00001" min="0" max="1.5" value="0.11085" title="Energiebelasting per kWh inclusief 21% btw">
      </div>
      <div class="surcharge-field">
        <label for="opslag">Opslag leverancier (€/kWh incl. btw)</label>
        <input id="opslag" type="number" step="0.00001" min="-2" max="5" value="0.02" title="Opslag of korting van je leverancier per kWh inclusief 21% btw; kan negatief">
      </div>
    </div>

    <p id="error" class="error" hidden></p>

    <section id="now-price" class="now-price" hidden></section>

    <section id="summary" class="summary"></section>

    <section id="chart" class="chart" role="img" aria-label="Uurprijzen van de geselecteerde dag"></section>

    <p id="empty" class="empty" hidden></p>

    <footer class="footer">
      <span>Bron: EnergyZero · €/kWh inclusief btw</span>
      <span id="updated"></span>
    </footer>
  </main>
  <script type="module" src="js/app.js?v=9"></script>
</body>
</html>
